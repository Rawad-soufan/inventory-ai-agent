
name: CI-CD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Django system check
        run: python manage.py check

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: docker build -t ghcr.io/rawad-soufan/inventory-ai-agent:latest .

      - name: Push Docker image
        run: docker push ghcr.io/rawad-soufan/inventory-ai-agent:latest

  deploy:
    needs: test
    runs-on: [self-hosted, inventory-deploy]

    steps:
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull Docker image
        run: docker pull ghcr.io/rawad-soufan/inventory-ai-agent:latest

      - name: Deploy on Windows
        shell: powershell
        run: |
          $existing = docker ps -aq --filter "name=^/inventory-app$"
          if ($existing) {
            docker rm -f inventory-app
          }
          docker run -d --name inventory-app -p 8000:8000 ghcr.io/rawad-soufan/inventory-ai-agent:latest
